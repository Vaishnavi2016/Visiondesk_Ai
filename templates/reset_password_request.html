<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - VisionDesk</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #08111f;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: #2563eb;
            filter: blur(180px);
            border-radius: 50%;
            top: -150px;
            left: -150px;
            opacity: .45;
        }
        body::after {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            background: #06b6d4;
            filter: blur(180px);
            border-radius: 50%;
            bottom: -120px;
            right: -100px;
            opacity: .35;
        }
        .reset-card {
            width: 420px;
            background: rgba(255,255,255,.08);
            backdrop-filter: blur(18px);
            border-radius: 25px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,.1);
            box-shadow: 0 25px 60px rgba(0,0,0,.45);
            position: relative;
            z-index: 5;
            animation: fade .7s;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 15px 35px rgba(37,99,235,.5);
        }
        h2 {
            text-align: center;
            margin-top: 18px;
            color: white;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 17px;
            color: #38bdf8;
        }
        .form-control {
            height: 52px;
            padding-left: 45px;
            background: rgba(255,255,255,.08);
            border: none;
            color: white;
        }
        .form-control:focus {
            background: rgba(255,255,255,.12);
            color: white;
            box-shadow: 0 0 0 .2rem rgba(37,99,235,.3);
        }
        .form-control::placeholder {
            color: #cbd5e1;
        }
        .btn-reset {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(90deg, #2563eb, #06b6d4);
            color: white;
            margin-top: 10px;
            transition: .3s;
        }
        .btn-reset:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(37,99,235,.45);
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #cbd5e1;
        }
        .footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
        }
        .back-link a {
            color: #94a3b8;
            text-decoration: none;
        }
        .back-link a:hover {
            color: white;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='redesign.css') }}">
</head>
<body>
    <div class="reset-card">
        <div class="logo">
            <i class="fa-solid fa-key"></i>
        </div>
        <h2>Reset Password</h2>
        <div class="subtitle">Enter your email to receive a reset link</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' if category == 'success' else 'info' }}" style="border-radius: 12px; margin-bottom: 15px;">
                        <i class="fa-solid fa-{{ 'circle-exclamation' if category == 'error' else 'check-circle' if category == 'success' else 'info-circle' }}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password_request') }}">
            <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
            
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" class="form-control" 
                       placeholder="Email Address" required>
            </div>

            <button class="btn-reset" type="submit">
                <i class="fa-solid fa-paper-plane"></i>
                Send Reset Link
            </button>
        </form>

        <div class="footer">
            Remember your password?
            <a href="{{ url_for('login') }}">Login</a>
        </div>
        
        <div class="back-link">
            <a href="{{ url_for('login') }}">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>
</body>
</html>
