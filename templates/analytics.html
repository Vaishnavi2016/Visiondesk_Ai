<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analytics - VisionDesk</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0a0e1a; color: white; font-family: Arial, sans-serif; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .chart-card h3 { margin-top: 0; }
        canvas { max-height: 300px; }
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: center; }
        .stat-box .value { font-size: 30px; font-weight: bold; }
        .stat-box .label { color: #94a3b8; }
        .value.green { color: #4ade80; }
        .value.red { color: #f87171; }
        .value.blue { color: #60a5fa; }
        .value.orange { color: #fb923c; }
        @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Analytics Dashboard</h1>
        <div class="stat-grid" id="statsGrid">
            <div class="stat-box">
                <div class="value blue" id="totalAudits">0</div>
                <div class="label">Total Audits</div>
            </div>
            <div class="stat-box">
                <div class="value red" id="totalViolations">0</div>
                <div class="label">Violations</div>
            </div>
            <div class="stat-box">
                <div class="value green" id="complianceRate">0%</div>
                <div class="label">Compliance Rate</div>
            </div>
            <div class="stat-box">
                <div class="value orange" id="totalWorkers">0</div>
                <div class="label">Total Workers</div>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-card">
                <h3>📈 Daily Activity</h3>
                <canvas id="timelineChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>🚨 Top Violations</h3>
                <canvas id="violationChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>🛡️ PPE Compliance</h3>
                <canvas id="ppeChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>📊 Overall Status</h3>
                <canvas id="statusChart"></canvas>
            </div>
        </div>
        <a href="/" style="color: #38bdf8; text-decoration: none;">← Back to Dashboard</a>
    </div>

    <script>
        fetch('/api/analytics')
            .then(r => r.json())
            .then(data => {
                document.getElementById('totalAudits').textContent = data.total_audits || 0;
                document.getElementById('totalViolations').textContent = data.total_violations || 0;
                document.getElementById('complianceRate').textContent = (data.compliance_rate || 0) + '%';
                document.getElementById('totalWorkers').textContent = data.total_workers || 0;
                
                // Timeline Chart
                new Chart(document.getElementById('timelineChart'), {
                    type: 'line',
                    data: {
                        labels: data.timeline?.map(d => d.date) || [],
                        datasets: [
                            { label: 'Total', data: data.timeline?.map(d => d.total) || [], borderColor: '#60a5fa', tension: 0.3 },
                            { label: 'Violations', data: data.timeline?.map(d => d.violations) || [], borderColor: '#f87171', tension: 0.3 }
                        ]
                    },
                    options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
                });
                
                // Violation Chart
                new Chart(document.getElementById('violationChart'), {
                    type: 'bar',
                    data: {
                        labels: data.top_violations?.map(v => v[0]) || [],
                        datasets: [{ label: 'Count', data: data.top_violations?.map(v => v[1]) || [], backgroundColor: '#f87171' }]
                    },
                    options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
                });
                
                // PPE Chart
                new Chart(document.getElementById('ppeChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Helmets', 'Vests', 'Masks'],
                        datasets: [{ data: [data.helmet_compliance || 0, data.vest_compliance || 0, data.mask_compliance || 0], backgroundColor: ['#f59e0b', '#3b82f6', '#22d3ee'] }]
                    },
                    options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } } }
                });
                
                // Status Chart
                new Chart(document.getElementById('statusChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Safe', 'Violations'],
                        datasets: [{ data: [data.safe_audits || 0, data.total_violations || 0], backgroundColor: ['#4ade80', '#f87171'] }]
                    },
                    options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } } }
                });
            })
            .catch(() => {});
    </script>
</body>
</html>
