<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - VisionDesk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0a0e1a; color: #e2e8f0; overflow-x: hidden; }

        :root {
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #f59e0b 100%);
            --accent-purple: #a78bfa;
            --accent-yellow: #fb923c;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.06);
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }
        
        h1 { 
            font-size: 28px; 
            font-weight: 700; 
            margin-bottom: 24px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        h1 i { color: var(--accent-yellow); order: 2; }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-box { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            padding: 20px; 
            text-align: center; 
            transition: 0.3s; 
        }
        .stat-box:hover { transform: translateY(-4px); border-color: rgba(245, 158, 11, 0.3); }
        .stat-box .value { font-size: 32px; font-weight: 800; }
        .stat-box .label { color: #94a3b8; font-size: 13px; margin-top: 4px; }

        .value.purple { color: #a78bfa; }
        .value.red { color: #f87171; }
        .value.yellow { color: #fb923c; }
        .value.orange { color: #fb923c; }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
        .chart-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            padding: 24px; 
        }
        .chart-card h3 { 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
        }
        .chart-card h3 i { color: var(--accent-purple); order: 2; }
        canvas { max-height: 280px; }

        .back-link { 
            color: var(--accent-yellow); 
            text-decoration: none; 
            font-weight: 600; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
        }
        .back-link i { order: 2; }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 992px) { .charts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analytics Dashboard <i class="fa-solid fa-chart-pie"></i></h1>
        
        <div class="stat-grid" id="statsGrid">
            <div class="stat-box">
                <div class="value purple" id="totalAudits">0</div>
                <div class="label">Total Audits</div>
            </div>
            <div class="stat-box">
                <div class="value red" id="totalViolations">0</div>
                <div class="label">Violations</div>
            </div>
            <div class="stat-box">
                <div class="value yellow" id="complianceRate">0%</div>
                <div class="label">Compliance Rate</div>
            </div>
            <div class="stat-box">
                <div class="value orange" id="totalWorkers">0</div>
                <div class="label">Total Workers</div>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-card">
                <h3>Daily Activity <i class="fa-solid fa-chart-line"></i></h3>
                <canvas id="timelineChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Top Violations <i class="fa-solid fa-triangle-exclamation"></i></h3>
                <canvas id="violationChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>PPE Compliance <i class="fa-solid fa-shield-halved"></i></h3>
                <canvas id="ppeChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Overall Status <i class="fa-solid fa-gauge-high"></i></h3>
                <canvas id="statusChart"></canvas>
            </div>
        </div>

        <a href="/" class="back-link"><span>Back to Dashboard</span> <i class="fa-solid fa-arrow-left"></i></a>
    </div>

    <script>
        fetch('/api/analytics')
            .then(r => r.json())
            .then(data => {
                document.getElementById('totalAudits').textContent = data.total_audits || 0;
                document.getElementById('totalViolations').textContent = data.total_violations || 0;
                document.getElementById('complianceRate').textContent = (data.compliance_rate || 0) + '%';
                document.getElementById('totalWorkers').textContent = data.total_workers || 0;
                
                new Chart(document.getElementById('timelineChart'), {
                    type: 'line',
                    data: {
                        labels: data.timeline?.map(d => d.date) || [],
                        datasets: [
                            { label: 'Total', data: data.timeline?.map(d => d.total) || [], borderColor: '#a78bfa', tension: 0.3 },
                            { label: 'Violations', data: data.timeline?.map(d => d.violations) || [], borderColor: '#f87171', tension: 0.3 }
                        ]
                    },
                    options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
                });
                
                new Chart(document.getElementById('violationChart'), {
                    type: 'bar',
                    data: {
                        labels: data.top_violations?.map(v => v[0]) || [],
                        datasets: [{ label: 'Count', data: data.top_violations?.map(v => v[1]) || [], backgroundColor: '#f87171' }]
                    },
                    options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
                });
                
                new Chart(document.getElementById('ppeChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Helmets', 'Vests', 'Masks'],
                        datasets: [{ data: [data.helmet_compliance || 0, data.vest_compliance || 0, data.mask_compliance || 0], backgroundColor: ['#fb923c', '#a78bfa', '#f87171'] }]
                    },
                    options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } } }
                });
                
                new Chart(document.getElementById('statusChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Safe', 'Violations'],
                        datasets: [{ data: [data.safe_audits || 0, data.total_violations || 0], backgroundColor: ['#fb923c', '#f87171'] }]
                    },
                    options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } } }
                });
            })
            .catch(() => {});
    </script>
</body>
</html>
