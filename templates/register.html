<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>VisionDesk AI | Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Poppins,sans-serif;

}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#08111f;

overflow:hidden;

}

/* Background */

body::before{

content:"";

position:absolute;

width:500px;

height:500px;

background:#2563eb;

filter:blur(180px);

border-radius:50%;

top:-150px;

left:-150px;

opacity:.45;

}

body::after{

content:"";

position:absolute;

width:450px;

height:450px;

background:#06b6d4;

filter:blur(180px);

border-radius:50%;

bottom:-120px;

right:-100px;

opacity:.35;

}

/* Card */

.card-register{

width:460px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:25px;

padding:40px;

border:1px solid rgba(255,255,255,.1);

box-shadow:0 25px 60px rgba(0,0,0,.45);

position:relative;

z-index:5;

animation:fade .7s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.logo{

width:90px;

height:90px;

margin:auto;

border-radius:50%;

background:linear-gradient(135deg,#2563eb,#06b6d4);

display:flex;

justify-content:center;

align-items:center;

font-size:38px;

color:white;

box-shadow:0 15px 35px rgba(37,99,235,.5);

}

h2{

text-align:center;

margin-top:18px;

color:white;

font-weight:700;

}

.subtitle{

text-align:center;

color:#cbd5e1;

margin-bottom:30px;

}

.input-group{

margin-bottom:18px;

position:relative;

}

.input-group i{

position:absolute;

left:15px;

top:17px;

color:#38bdf8;

}

.form-control{

height:52px;

padding-left:45px;

background:rgba(255,255,255,.08);

border:none;

color:white;

}

.form-control:focus{

background:rgba(255,255,255,.12);

color:white;

box-shadow:0 0 0 .2rem rgba(37,99,235,.3);

}

.form-control::placeholder{

color:#cbd5e1;

}

.eye{

position:absolute;

right:18px;

top:17px;

cursor:pointer;

color:white;

}

.strength{

height:8px;

background:#1e293b;

border-radius:10px;

margin-top:10px;

overflow:hidden;

}

.bar{

height:100%;

width:0;

background:red;

transition:.3s;

}

.btn-register{

width:100%;

height:54px;

border:none;

border-radius:12px;

font-size:17px;

font-weight:600;

background:linear-gradient(90deg,#2563eb,#06b6d4);

color:white;

margin-top:20px;

transition:.3s;

}

.btn-register:hover{

transform:translateY(-3px);

box-shadow:0 15px 35px rgba(37,99,235,.45);

}

.footer{

text-align:center;

margin-top:20px;

color:#cbd5e1;

}

.footer a{

color:#38bdf8;

text-decoration:none;

font-weight:600;

}

.footer a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="card-register">

<div class="logo">

<i class="fa-solid fa-user-plus"></i>

</div>

<h2>

Create Account

</h2>

<div class="subtitle">

VisionDesk AI Registration Portal

</div>

<form method="POST">

<div class="input-group">

<i class="fa-solid fa-user"></i>

<input

type="text"

name="username"

class="form-control"

placeholder="Username"

required>

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input

type="password"

id="password"

name="password"

class="form-control"

placeholder="Password"

required>

<i

class="fa-solid fa-eye eye"

onclick="togglePassword()">

</i>

<div class="strength">

<div class="bar" id="bar"></div>

</div>

</div>

<button

class="btn-register">

<i class="fa-solid fa-user-check"></i>

Register Account

</button>

</form>

<div class="footer">

Already have an account?

<a href="/login">

Login

</a>

</div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const eye = document.querySelector(".eye");

    if (password.type === "password") {
        password.type = "text";
        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");
    } else {
        password.type = "password";
        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
    }
}

const passwordInput = document.getElementById("password");
const bar = document.getElementById("bar");

passwordInput.addEventListener("keyup", function () {

    let value = passwordInput.value;
    let strength = 0;

    if (value.length >= 8) strength++;
    if (/[A-Z]/.test(value)) strength++;
    if (/[0-9]/.test(value)) strength++;
    if (/[^A-Za-z0-9]/.test(value)) strength++;

    switch (strength) {
        case 0:
            bar.style.width = "0%";
            break;

        case 1:
            bar.style.width = "25%";
            bar.style.background = "#ef4444";
            break;

        case 2:
            bar.style.width = "50%";
            bar.style.background = "#f59e0b";
            break;

        case 3:
            bar.style.width = "75%";
            bar.style.background = "#3b82f6";
            break;

        case 4:
            bar.style.width = "100%";
            bar.style.background = "#22c55e";
            break;
    }
});

// Add password strength indicator label
const strengthLabels = ['Very Weak', 'Weak', 'Medium', 'Strong', 'Very Strong'];
const strengthColors = ['#ef4444', '#f59e0b', '#f59e0b', '#3b82f6', '#22c55e'];

passwordInput.addEventListener("keyup", function () {
    let value = passwordInput.value;
    let strength = 0;

    if (value.length >= 8) strength++;
    if (/[A-Z]/.test(value)) strength++;
    if (/[0-9]/.test(value)) strength++;
    if (/[^A-Za-z0-9]/.test(value)) strength++;

    const bar = document.getElementById("bar");
    bar.style.width = (strength * 25) + "%";
    bar.style.background = strengthColors[strength];
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
