<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - VisionDesk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0a0e1a; color: #e2e8f0; }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 0 24px; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 28px; font-weight: 700; }
        .header h1 i { color: #f87171; margin-right: 12px; }
        
        .alert-filters {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 20px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(124, 58, 237, 0.2);
            border-color: #7c3aed;
            color: white;
        }
        
        .alert-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
            border-left: 4px solid #f87171;
        }
        .alert-card.resolved {
            border-left-color: #4ade80;
            opacity: 0.6;
        }
        .alert-card:hover { transform: translateX(4px); }
        
        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .alert-title {
            font-weight: 600;
            font-size: 16px;
        }
        .alert-time {
            color: #94a3b8;
            font-size: 13px;
        }
        .alert-violations {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
        }
        .violation-tag {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        .alert-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .resolve-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(34,197,94,0.2);
            color: #4ade80;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .resolve-btn:hover { background: rgba(34,197,94,0.3); }
        .delete-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(239,68,68,0.15);
            color: #f87171;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .delete-btn:hover { background: rgba(239,68,68,0.3); }
        
        .back-link {
            color: #94a3b8;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-link:hover { color: #e2e8f0; }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 9999;
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 400px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { background: rgba(34,197,94,0.9); }
        .toast.error { background: rgba(239,68,68,0.9); }
        .toast.info { background: rgba(124,58,237,0.9); }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        
        <div class="header">
            <h1><i class="fa-solid fa-bell"></i> Violation Alerts</h1>
            <div style="display: flex; gap: 12px;">
                <button class="resolve-btn" onclick="resolveAllAlerts()">
                    <i class="fa-solid fa-check-double"></i> Resolve All
                </button>
                <button class="delete-btn" onclick="deleteAllAlerts()">
                    <i class="fa-solid fa-trash-can"></i> Delete All
                </button>
            </div>
        </div>
        
        <div class="alert-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="unresolved">Unresolved</button>
            <button class="filter-btn" data-filter="resolved">Resolved</button>
            <button class="filter-btn" data-filter="critical">Critical</button>
        </div>
        
        <div id="alertsContainer">
            <!-- Alerts will be loaded here -->
            <div style="text-align: center; padding: 60px 0; color: #64748b;">
                <i class="fa-solid fa-inbox" style="font-size: 48px; display: block; margin-bottom: 16px;"></i>
                <p>No alerts found</p>
            </div>
        </div>
    </div>
    
    <script>
        let currentFilter = 'all';
        
        // Load alerts
        function loadAlerts() {
            fetch('/api/alerts')
                .then(r => r.json())
                .then(data => {
                    renderAlerts(data);
                })
                .catch(() => {});
        }
        
        function renderAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            
            if (!alerts || alerts.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 0; color: #64748b;">
                        <i class="fa-solid fa-inbox" style="font-size: 48px; display: block; margin-bottom: 16px;"></i>
                        <p>No alerts found</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = alerts.map(alert => `
                <div class="alert-card ${alert.resolved ? 'resolved' : ''}" data-id="${alert._id}">
                    <div class="alert-header">
                        <div class="alert-title">
                            <i class="fa-solid fa-${alert.severity >= 3 ? 'circle-exclamation' : 'triangle-exclamation'}" 
                               style="color: ${alert.severity >= 3 ? '#ef4444' : '#fb923c'};"></i>
                            ${alert.violations.join(', ')}
                            ${alert.resolved ? '✅' : ''}
                        </div>
                        <div class="alert-time">
                            ${new Date(alert.created_at).toLocaleString()}
                        </div>
                    </div>
                    <div class="alert-violations">
                        ${alert.violations.map(v => `<span class="violation-tag">${v}</span>`).join('')}
                        <span class="violation-tag" style="background: rgba(124,58,237,0.15); color: #a78bfa;">
                            Severity: ${alert.severity}/3
                        </span>
                    </div>
                    ${!alert.resolved ? `
                        <div class="alert-actions">
                            <button class="resolve-btn" onclick="resolveAlert('${alert._id}')">
                                <i class="fa-solid fa-check"></i> Resolve
                            </button>
                            <button class="delete-btn" onclick="deleteAlert('${alert._id}')">
                                <i class="fa-solid fa-trash-can"></i> Delete
                            </button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }
        
        function resolveAlert(alertId) {
            fetch(`/api/alerts/${alertId}/resolve`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showToast('Alert resolved successfully', 'success');
                        loadAlerts();
                    }
                });
        }
        
        function resolveAllAlerts() {
            if (!confirm('Resolve all alerts?')) return;
            fetch('/api/alerts/resolve-all', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showToast('All alerts resolved', 'success');
                        loadAlerts();
                    }
                });
        }
        
        function deleteAlert(alertId) {
            if (!confirm('Delete this alert?')) return;
            fetch(`/api/alerts/${alertId}`, { method: 'DELETE' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showToast('Alert deleted', 'success');
                        loadAlerts();
                    }
                });
        }
        
        function deleteAllAlerts() {
            if (!confirm('Delete all alerts?')) return;
            fetch('/api/alerts', { method: 'DELETE' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showToast('All alerts deleted', 'success');
                        loadAlerts();
                    }
                });
        }
        
        // Toast
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // Filters
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                // Implement filtering
            });
        });
        
        // Load alerts on page load
        loadAlerts();
        
        // Refresh every 30 seconds
        setInterval(loadAlerts, 30000);
    </script>
</body>
</html>
