<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionDesk AI | Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

body {
    height: 100vh;
    background: #0a0e1a;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

body::before {
    content: '';
    position: absolute;
    width: 450px;
    height: 450px;
    background: #7c3aed;
    border-radius: 50%;
    filter: blur(180px);
    top: -100px;
    left: -120px;
    opacity: .35;
}

body::after {
    content: '';
    position: absolute;
    width: 450px;
    height: 450px;
    background: #f59e0b;
    border-radius: 50%;
    filter: blur(180px);
    bottom: -120px;
    right: -100px;
    opacity: .25;
}

.login-card {
    width: 430px;
    background: rgba(255,255,255,.04);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 25px;
    padding: 40px;
    box-shadow: 0 25px 70px rgba(0,0,0,.5);
    z-index: 5;
}

.logo {
    width: 80px;
    height: 80px;
    margin: auto;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 36px;
    background: linear-gradient(135deg, #7c3aed, #f59e0b);
    color: white;
    box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
}

.title { text-align: center; margin-top: 20px; color: white; font-size: 28px; font-weight: 700; }
.subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 13px; }

.form-control {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,0.08);
    height: 52px;
    color: white;
    padding-right: 45px;
    border-radius: 12px;
}

.form-control:focus {
    background: rgba(255,255,255,.1);
    color: white;
    border-color: #fb923c;
    box-shadow: none;
}

.input-box { position: relative; margin-bottom: 20px; }
.input-box i { position: absolute; right: 18px; top: 18px; color: #fb923c; }

.btn-login {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    background: linear-gradient(135deg, #7c3aed, #f59e0b);
    color: white;
    transition: .3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.btn-login i { order: 2; }
.btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(245, 158, 11, .3); }

.footer { margin-top: 22px; text-align: center; color: #94a3b8; font-size: 13px; }
.footer a { color: #fb923c; text-decoration: none; font-weight: 600; }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='redesign.css') }}">
</head>
<body>

<div class="login-card">
    <div class="logo"><i class="fa-solid fa-robot"></i></div>
    <div class="title">VisionDesk AI</div>
    <div class="subtitle">Smart PPE Detection & Document Intelligence</div>

    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">

        <div class="input-box">
            <input type="text" class="form-control" name="username" placeholder="Enter Username" required>
            <i class="fa-solid fa-user"></i>
        </div>

        <div class="input-box">
            <input type="password" id="password" class="form-control" name="password" placeholder="Enter Password" required>
            <i class="fa-solid fa-lock"></i>
        </div>

        <button class="btn-login">
            <span>Login Securely</span>
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
    </form>

    <div class="footer">
        Don't have an account? <a href="{{ url_for('register') }}">Create Account</a>
    </div>
</div>

</body>
</html>
